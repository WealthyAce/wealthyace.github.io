<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World | WealthyAce</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #ffffff 30%, var(--primary) 70%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.lead {
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .interactive-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .clock {
      font-family: ui-monospace, monospace;
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #0f172a;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .click-count {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .links a:hover {
      color: var(--primary);
    }

    footer {
      margin-top: 25px;
      color: #64748b;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 Live on GitHub Pages</div>
    <h1>Hello, World!</h1>
    <p class="lead">
      Selamat datang di situs pribadi <strong>WealthyAce</strong>.<br>
      Program web pertama yang berhasil di-deploy ke GitHub Pages.
    </p>

    <div class="interactive-box">
      <div id="liveClock" class="clock">00:00:00</div>
      <button class="btn" id="clickBtn">
        ✨ Klik Saya
      </button>
      <div class="click-count" id="counterText">Sudah diklik: 0 kali</div>
    </div>

    <div class="links">
      <a href="https://github.com/WealthyAce" target="_blank" rel="noopener noreferrer">📂 Profil GitHub</a>
      <span>•</span>
      <a href="https://github.com/WealthyAce/wealthyace.github.io" target="_blank" rel="noopener noreferrer">💻 Kode Sumber</a>
    </div>

    <footer>
      Dibuat dengan ❤️ • WealthyAce.github.io
    </footer>
  </div>

  <script>
    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = now.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Click Counter
    let count = 0;
    const greetings = [
      "Semangat belajar ngoding!",
      "Coding is awesome!",
      "Keep pushing forward!",
      "Great job on your first GitHub Page!",
      "Software development awaits you!"
    ];

    const btn = document.getElementById('clickBtn');
    const counterText = document.getElementById('counterText');

    btn.addEventListener('click', () => {
      count++;
      const randomMsg = greetings[(count - 1) % greetings.length];
      counterText.innerHTML = `Sudah diklik: <strong>${count}</strong> kali — <em>"${randomMsg}"</em>`;
    });
  </script>
</body>
</html>
